<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои записи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu"></div>

  <div class="page">
    <h2>Мои записи</h2>
    <p id="msg" class="msg"></p>
    <div id="list" class="hint">Загрузка...</div>
  </div>

  <script src="common.js"></script>
  <script>
    initPage();

    async function load() {
      let rows;
      try {
        rows = await api('GET', '/appointments');
      } catch (err) {
        document.getElementById('list').textContent = err.message;
        return;
      }
      if (rows.length === 0) {
        document.getElementById('list').innerHTML = emptyBlock('Записей пока нет. <a href="book.html">Записаться</a>');
        return;
      }
      let html = '<table><tr><th>Дата и время</th><th>Питомец</th><th>Услуга</th><th>Цена</th><th>Статус</th><th></th></tr>';
      for (const a of rows) {
        html += '<tr><td><b>' + formatDate(a.start_at) + '</b></td><td>' + esc(a.pet_name) + '</td><td>' + esc(a.service_title) +
          '</td><td>' + a.price + ' руб.</td><td>' + statusBadge(a.status) + '</td><td class="actions">' +
          (a.status === 'booked' ? '<button class="small danger" onclick="cancel(' + a.id + ')">Отменить</button>' : '') + '</td></tr>';
      }
      document.getElementById('list').innerHTML = html + '</table>';
    }

    async function cancel(id) {
      if (!confirm('Отменить запись?')) return;
      try {
        await api('POST', '/appointments/' + id + '/cancel');
        showMsg('msg', 'Запись отменена');
        load();
      } catch (err) {
        showMsg('msg', err.message, true);
      }
    }

    load();
  </script>
</body>
</html>
