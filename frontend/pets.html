<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мои питомцы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu"></div>

  <h2>Мои питомцы</h2>
  <div id="list">Загрузка...</div>

  <div class="box">
    <h3 id="formTitle">Добавить питомца</h3>
    <form id="petForm">
      Кличка <input name="name" required>
      Вид
      <select name="species">
        <option>собака</option>
        <option>кошка</option>
        <option>другое</option>
      </select>
      Порода <input name="breed">
      Вес, кг <input name="weight" type="number" step="0.1" min="0.1" max="100" required>
      <button type="submit">Сохранить</button>
      <button type="button" onclick="resetForm()">Очистить</button>
    </form>
    <p id="msg" class="msg"></p>
  </div>

  <script src="common.js"></script>
  <script>
    initPage();
    let pets = [];
    let editId = null;

    async function load() {
      try {
        pets = await api('GET', '/pets');
      } catch (err) {
        document.getElementById('list').textContent = err.message;
        return;
      }
      if (pets.length === 0) {
        document.getElementById('list').innerHTML = '<p>У вас пока нет питомцев. Добавьте первого ниже.</p>';
        return;
      }
      let html = '<table><tr><th>Кличка</th><th>Вид</th><th>Порода</th><th>Вес</th><th></th></tr>';
      for (const p of pets) {
        html += '<tr><td>' + esc(p.name) + '</td><td>' + p.species + '</td><td>' + esc(p.breed) +
          '</td><td>' + p.weight + ' кг</td><td>' +
          '<button onclick="edit(' + p.id + ')">Изменить</button> ' +
          '<button onclick="removePet(' + p.id + ')">Удалить</button></td></tr>';
      }
      document.getElementById('list').innerHTML = html + '</table>';
    }

    function edit(id) {
      const p = pets.find(x => x.id === id);
      const form = document.getElementById('petForm');
      form.name.value = p.name;
      form.species.value = p.species;
      form.breed.value = p.breed;
      form.weight.value = p.weight;
      editId = id;
      document.getElementById('formTitle').textContent = 'Изменить питомца: ' + p.name;
    }

    function resetForm() {
      document.getElementById('petForm').reset();
      editId = null;
      document.getElementById('formTitle').textContent = 'Добавить питомца';
    }

    async function removePet(id) {
      if (!confirm('Удалить питомца?')) return;
      try {
        await api('DELETE', '/pets/' + id);
        showMsg('msg', 'Питомец удалён');
        load();
      } catch (err) {
        showMsg('msg', err.message, true);
      }
    }

    document.getElementById('petForm').onsubmit = async function (e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(this));
      data.weight = Number(data.weight);
      try {
        if (editId) {
          await api('PUT', '/pets/' + editId, data);
        } else {
          await api('POST', '/pets', data);
        }
        showMsg('msg', 'Сохранено');
        resetForm();
        load();
      } catch (err) {
        showMsg('msg', err.message, true);
      }
    };

    load();
  </script>
</body>
</html>
