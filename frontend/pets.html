<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои питомцы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu"></div>

  <div class="page">
    <h2>Мои питомцы</h2>
    <div id="list" class="hint">Загрузка...</div>

    <div class="box">
      <h3 id="formTitle">Добавить питомца</h3>
      <form id="petForm">
        <label class="field">Кличка <input name="name" required></label>
        <label class="field">Вид
          <select name="species">
            <option>собака</option>
            <option>кошка</option>
            <option>другое</option>
          </select>
        </label>
        <label class="field">Порода <input name="breed"></label>
        <label class="field">Вес, кг <input name="weight" type="number" step="0.1" min="0.1" max="100" required></label>
        <button type="submit">Сохранить</button>
        <button type="button" onclick="resetForm()">Очистить</button>
      </form>
      <p id="msg" class="msg"></p>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    initPage();
    let pets = [];
    let editId = null;
    const ICON = { 'собака': '🐶', 'кошка': '🐱', 'другое': '🐾' };

    async function load() {
      try {
        pets = await api('GET', '/pets');
      } catch (err) {
        document.getElementById('list').textContent = err.message;
        return;
      }
      if (pets.length === 0) {
        document.getElementById('list').innerHTML = emptyBlock('У вас пока нет питомцев. Добавьте первого ниже.');
        return;
      }
      let html = '<table><tr><th>Кличка</th><th>Вид</th><th>Порода</th><th>Вес</th><th></th></tr>';
      for (const p of pets) {
        html += '<tr><td><b>' + ICON[p.species] + ' ' + esc(p.name) + '</b></td><td>' + p.species + '</td><td>' + esc(p.breed) +
          '</td><td>' + p.weight + ' кг</td><td class="actions">' +
          '<button class="small" onclick="edit(' + p.id + ')">Изменить</button> ' +
          '<button class="small danger" onclick="removePet(' + p.id + ')">Удалить</button></td></tr>';
      }
      document.getElementById('list').innerHTML = html + '</table>';
    }

    function edit(id) {
      const p = pets.find(x => x.id === id);
      const form = document.getElementById('petForm');
      form.name.value = p.name;
      form.species.value = p.species;
      form.breed.value = p.breed;
      form.weight.value = p.weight;
      editId = id;
      document.getElementById('formTitle').textContent = 'Изменить питомца: ' + p.name;
    }

    function resetForm() {
      document.getElementById('petForm').reset();
      editId = null;
      document.getElementById('formTitle').textContent = 'Добавить питомца';
    }

    async function removePet(id) {
      if (!confirm('Удалить питомца?')) return;
      try {
        await api('DELETE', '/pets/' + id);
        showMsg('msg', 'Питомец удалён');
        load();
      } catch (err) {
        showMsg('msg', err.message, true);
      }
    }

    document.getElementById('petForm').onsubmit = async function (e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(this));
      data.weight = Number(data.weight);
      try {
        if (editId) {
          await api('PUT', '/pets/' + editId, data);
        } else {
          await api('POST', '/pets', data);
          // пришли со страницы записи - возвращаемся туда
          if (getNext()) {
            location.href = getNext();
            return;
          }
        }
        showMsg('msg', 'Сохранено');
        resetForm();
        load();
      } catch (err) {
        showMsg('msg', err.message, true);
      }
    };

    load();
  </script>
</body>
</html>
