<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Груминг-салон «Пушистик»</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu"></div>

  <div class="page">
    <div class="hero">
      <h1>Груминг-салон «Пушистик»</h1>
      <p>Выберите услугу и запишите питомца онлайн — без звонков</p>
    </div>

    <div id="list" class="hint">Загрузка...</div>
  </div>

  <script src="common.js"></script>
  <script>
    const user = initPage(false, true);
    // у администратора своя главная страница
    if (user && user.role === 'admin') location.href = 'admin.html';

    async function load() {
      let services;
      try {
        services = (await api('GET', '/services')).filter(s => s.is_active);
      } catch (err) {
        document.getElementById('list').textContent = err.message;
        return;
      }
      if (services.length === 0) {
        document.getElementById('list').innerHTML = emptyBlock('Сейчас нет доступных услуг');
        return;
      }
      let html = '<div class="cards">';
      for (const s of services) {
        html += '<div class="box card">' +
          '<h3>' + esc(s.title) + '</h3>' +
          '<p class="hint">' + esc(s.description) + '</p>' +
          '<div class="card-bottom"><span class="price">' + s.price + ' ₽</span><span class="hint">' + s.duration + ' мин</span></div>' +
          '<button class="primary" onclick="choose(' + s.id + ')">Записаться</button>' +
          '</div>';
      }
      document.getElementById('list').innerHTML = html + '</div>';
    }

    // выбрали услугу: если вошёл - сразу на запись, если нет - сначала вход
    function choose(serviceId) {
      const bookUrl = 'book.html?service=' + serviceId;
      if (getUser()) {
        location.href = bookUrl;
      } else {
        location.href = 'login.html?next=' + encodeURIComponent(bookUrl);
      }
    }

    load();
  </script>
</body>
</html>
